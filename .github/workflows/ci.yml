name: CI

# Self-hosted runners only (owner requirement). Runs on pushes and on PRs
# from branches of this repository. Fork PRs never run on the self-hosted
# runner, because the job condition below skips them.
on:
  push:
    branches: [main, "g*/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks (lint, tests, validation, headless smoke)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, eagle-defense]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check runner prerequisites
        run: |
          missing=0
          for t in love luajit luarocks xvfb-run zip unzip curl gcc; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::missing $t (see docs/CI_RUNNER.md)"; missing=1; }
          done
          exit $missing

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            .rocks
            .tools
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.sh') }}

      - name: Bootstrap
        run: make bootstrap

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Unit and scenario tests
        run: make test

      - name: Architecture and asset validation
        run: make validate

      - name: Headless smoke (Xvfb, software GL)
        run: make smoke

      - name: Build .love
        run: make love

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-defense-${{ github.sha }}-linux
          path: |
            dist/
            build/
          retention-days: 14

  macos:
    name: macOS native smoke (owner's Mac runner)
    # Opt-in: set the repository variable MACOS_RUNNER=1 once the runner is registered.
    if: vars.MACOS_RUNNER == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, eagle-defense]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        run: make bootstrap

      - name: Unit tests
        run: make test

      - name: Native smoke (real display; requires a logged-in GUI session)
        run: make smoke LOVE="${LOVE_BIN:-/Applications/love.app/Contents/MacOS/love}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-defense-${{ github.sha }}-macos
          path: build/
          retention-days: 14
